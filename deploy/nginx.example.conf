# 1Panel / OpenResty reverse-proxy example for Oldtian's FRP Service.
#
# Two server blocks:
#   1. Wildcard *.tunnel.oldtian.top -> frps vhostHTTPPort (127.0.0.1:8080).
#      One block serves ALL HTTP tunnels; adding a new tunnel needs no Nginx edit.
#   2. api.tunnel.oldtian.top        -> ofs-control-api (127.0.0.1:8088).
#
# In 1Panel you normally create the sites in the UI and let it manage SSL; the
# blocks below show the essential proxy settings to replicate.

# --- All HTTP tunnels (wildcard) --------------------------------------------
server {
    listen 443 ssl http2;
    server_name *.tunnel.oldtian.top;

    ssl_certificate     /path/to/fullchain.pem;     # wildcard cert for *.tunnel.oldtian.top
    ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_set_header Host $host;                # frps routes by Host header
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support for proxied apps.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://127.0.0.1:8080;
    }
}

# --- control-api ------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.tunnel.oldtian.top;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass http://127.0.0.1:8088;
    }
}
